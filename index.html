<style>
/* Layout: phone app shell. Sticky app bar (burger, title, sync dot), slide-in drawer for navigation, one screen at a time, floating + button; job details slide over as a full screen sheet */
:root{
  --bg:#f2f0ec; --surface:#ffffff; --raised:#f8f7f4; --fg:#161616; --muted:#67635e; --line:#dcd8d1; --chip:#e9e6e0;

  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131313; --surface:#1c1c1b; --raised:#242322; --fg:#ece6dc; --muted:#a29d96; --line:#302f2d; --chip:#2a2927;
  --accent:#e4dcd4; --accent-ink:#151515; --roof:#9e9996;
  --warn:#ff8f6b; --warn-bg:#3a2017; --ok:#72d08d; --ok-bg:#16301f; --info:#8fc0ea; --info-bg:#172839; --idle:#8d8f84;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131313; --surface:#1c1c1b; --raised:#242322; --fg:#ece6dc; --muted:#a29d96; --line:#302f2d; --chip:#2a2927;
  --accent:#e4dcd4; --accent-ink:#151515; --roof:#9e9996;
  --warn:#ff8f6b; --warn-bg:#3a2017; --ok:#72d08d; --ok-bg:#16301f; --info:#8fc0ea; --info-bg:#172839; --idle:#8d8f84;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.3rem} h3{font-size:1.1rem}
p{margin:0}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar-in{max-width:680px;margin:0 auto;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:10px;min-height:60px}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;background:transparent;color:var(--fg);border-radius:12px;cursor:pointer}
.iconbtn:hover{background:var(--chip)}
.iconbtn svg{width:24px;height:24px}
.lockup{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:36px;height:36px;flex:none}
.ttl{min-width:0}
.ttl h1{font-size:1.3rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap}
.syncdot{width:10px;height:10px;border-radius:50%;background:var(--idle);flex:none;margin-right:4px}
.syncdot[data-s="cloud"]{background:var(--ok)} .syncdot[data-s="local"],.syncdot[data-s="bad"]{background:var(--warn)}
.togo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.togo button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:16px;padding:12px 14px;font:600 .9rem var(--body);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.togo b{font-family:var(--display);font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.togo .today{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.togo button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#drawer{position:fixed;inset:0;z-index:25}
.scrim{position:absolute;inset:0;background:var(--scrim);border:0;width:100%;cursor:pointer}
.sheet{position:absolute;inset:0 auto 0 0;width:min(84vw,320px);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slidein .2s ease-out}.scrim{animation:fadein .2s}}
@keyframes slidein{from{transform:translateX(-100%)}} @keyframes fadein{from{opacity:0}}
.sheet-brand{display:flex;align-items:center;gap:12px;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sheet-brand .mark{width:52px;height:52px}
.sheet-brand strong{font-family:var(--display);font-size:1.45rem;line-height:1;display:block}
.sheet-brand span{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.navlink{display:flex;align-items:center;gap:14px;min-height:50px;padding:0 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600;font-size:1.05rem}
.navlink svg{width:22px;height:22px;flex:none;color:var(--muted)}
.navlink .ct{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.85rem;background:var(--chip);border-radius:999px;padding:1px 9px;color:var(--muted)}
.navlink .ct:empty{display:none}
.mark{border-radius:9px;object-fit:cover;background:#151515;border:1px solid var(--line)}
.wordmark{width:100%;max-width:260px;height:auto;border-radius:10px;display:block}
.navlink[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.navlink[aria-current="page"] svg,.navlink[aria-current="page"] .ct{color:var(--accent-ink)}
.navlink[aria-current="page"] .ct{background:transparent;border:1px solid currentColor}
.navlink:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--fg);border-radius:9px;min-height:38px;font:600 .9rem var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.sheet .sub{font-size:.85rem;color:var(--muted);padding:0 12px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px}
.fab:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.pagehead h2{font-size:1.6rem}
.pagehead p{color:var(--muted)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;font:600 1rem var(--body);text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:0 10px;font-size:.92rem}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.chip{background:var(--chip);border-radius:999px;padding:3px 11px;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;width:100%}
textarea{min-height:180px;resize:vertical;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.daynav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.daynav .btn{padding:0}
.daytitle{text-align:center}
.daytitle h2{font-size:1.5rem}
.daytitle input{max-width:180px;margin:4px auto 0;display:block;min-height:36px;padding:4px 8px;text-align:center}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.calls{background:var(--warn-bg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.calls h3{color:var(--warn)}
.remind{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:20;max-width:560px;margin:0 auto;background:var(--warn-bg);color:var(--fg);border:2px solid var(--warn);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.why{position:fixed;inset:auto 0 0 0;z-index:21;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.why .chips{display:flex;flex-wrap:wrap;gap:8px}
.why .chips button{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--fg);padding:0 12px;font:500 .92rem var(--body);cursor:pointer}
.why .chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.report{white-space:pre-wrap;font:500 .9rem/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:50vh;overflow:auto;margin:0}
.remind strong{color:var(--warn);font-size:1.05rem}
.remind .row{display:flex;gap:8px;flex-wrap:wrap}
.calls ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.legs{display:flex;flex-direction:column;gap:8px}
.leg{justify-content:space-between;width:100%}
.leg small{font-weight:500;opacity:.8}
ol.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.drive{color:var(--muted);font-size:.9rem;padding-left:64px}
.stop{display:grid;grid-template-columns:52px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;border-left-width:5px}
.stop[data-tone="ok"]{border-left-color:var(--ok)} .stop[data-tone="warn"]{border-left-color:var(--warn)} .stop[data-tone="info"]{border-left-color:var(--info)} .stop[data-tone="idle"]{border-left-color:var(--line)}
.stop.finished{opacity:.62}
.time{font-family:var(--display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.1}
.num{display:block;font-size:.8rem;color:var(--muted);font-family:var(--body);font-weight:600}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.addr{font-weight:600;font-size:1.05rem}
.who{color:var(--muted);overflow-wrap:anywhere}
.window{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 8px;font-size:.85rem;font-weight:600;width:fit-content}
.window.tight{background:var(--accent);color:var(--accent-ink)}
.window.late{background:var(--warn);color:var(--surface)}
.note{border-left:3px solid var(--warn);padding-left:8px;font-size:.95rem;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.phone{font-variant-numeric:tabular-nums;user-select:all}
.btn.donebtn{background:var(--ok);border-color:var(--ok);color:var(--surface);white-space:nowrap}
.stop.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.nexttag{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 7px;width:fit-content}
.focus{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.focus .eyebrow{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.focus .due{font-family:var(--display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.focus .faddr{font-family:var(--display);font-size:1.55rem;line-height:1.1;text-wrap:balance}
.focus .fwho{color:var(--muted);font-size:1.02rem;overflow-wrap:anywhere}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigbtns .btn{min-height:56px;font-size:1.08rem;border-radius:14px}
.bigbtns .wide{grid-column:1/-1}
.focus .prog{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.focus .prog i{display:block;height:100%;background:var(--ok)}
.lastdone{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.donerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ok);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;width:fit-content;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill[data-tone="ok"]{background:var(--ok-bg);color:var(--ok)} .pill[data-tone="warn"]{background:var(--warn-bg);color:var(--warn)} .pill[data-tone="info"]{background:var(--info-bg);color:var(--info)} .pill[data-tone="idle"]{background:var(--chip);color:var(--muted)} .pill[data-tone="accent"]{background:var(--accent);color:var(--accent-ink)}
.mover{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mover .btn{min-height:34px;padding:0;font-size:.9rem}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 .9rem var(--body);cursor:pointer;min-height:36px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters b{font-variant-numeric:tabular-nums;margin-left:4px}

.jobrow{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.jobrow .sub{grid-column:1/-1;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.empty{border:2px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.banner{background:var(--info-bg);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:.95rem}
.banner.warn{background:var(--warn-bg)}
.preview{display:flex;flex-direction:column;gap:8px}
.pv{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.pv input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ok);margin-top:2px}
.pv .dup{color:var(--warn);font-weight:600;font-size:.88rem}
#panel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.statusgrid button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .92rem var(--body);cursor:pointer}
.statusgrid button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hist{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.confirm{background:var(--warn-bg);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<script>
/* ---------- constants ---------- */
const STANDALONE = true; // set to true in the installable web app build
const CHECKLIST_URL = "https://claude.ai/artifact/VbUg9zQX6TcTgWJCmLD9Sy";
const DEFAULT_CFG = { home:"OL8 2AJ", surveyMins:15, installMins:180, travelMins:105, leave:"08:00", dark:"16:00" };
const STATUSES = [
  {k:"new", label:"To book", tone:"idle"},
  {k:"booked", label:"Survey booked", tone:"info"},
  {k:"surveyed", label:"Surveyed", tone:"ok"},
  {k:"noanswer", label:"No answer", tone:"warn"},
  {k:"rebook", label:"Rebook", tone:"warn"},
  {k:"ready", label:"Ready for install", tone:"accent"},
  {k:"installbooked", label:"Install booked", tone:"info"},
  {k:"installed", label:"Installed", tone:"ok"},
  {k:"cancelled", label:"Cancelled", tone:"idle"},
];
const ST = Object.fromEntries(STATUSES.map(s => [s.k, s]));
const INSTALL_STAGE = new Set(["ready","installbooked","installed"]);
const FINISHED = new Set(["surveyed","installed","cancelled","noanswer"]);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const niceDate = s => parseYmd(s).toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"});
const shortDate = s => parseYmd(s).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
const toMin = t => { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h,m] = t.split(":").map(Number); return h*60+m; };
const toHM = m => `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const newId = () => "j" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const normPc = s => String(s||"").toUpperCase().replace(/\s+/g,"").replace(/^(.+)(\d[A-Z]{2})$/, "$1 $2");
const telOf = s => String(s||"").replace(/[^\d+]/g, "");
const q = j => encodeURIComponent(`${j.address}, ${j.postcode}, UK`);
const navUrl = j => `https://www.google.com/maps/dir/?api=1&destination=${q(j)}&travelmode=driving`;
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
const todayYmd = () => ymd(new Date());

/* ---------- theme (per device) ---------- */
function applyTheme(t){
  const r = document.documentElement;
  if (t === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t);
  document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
}
let THEME = lsGet("loftjobs-theme", "dark");
applyTheme(THEME);

/* ---------- state ---------- */
const S = { jobs:new Map(), days:{}, cfg:{...DEFAULT_CFG}, mode:"loading", view:"day", day:todayYmd(), autoDay:true, filters:{surveys:"togo", installs:"all"}, addKind:"survey", filter:"active", search:"", parsed:null, busy:"" };
let db = null, sampleFn = null, downloads = null;

/* ---------- store ---------- */
function localSave(){ lsSet("loftjobs-local", {jobs:[...S.jobs.values()], days:S.days, cfg:S.cfg}); }
function useLocal(reason){
  if (S.mode === "cloud") return;
  const L = lsGet("loftjobs-local", null);
  if (L){ S.jobs = new Map((L.jobs||[]).map(j => [j.id, j])); S.days = L.days || {}; S.cfg = {...DEFAULT_CFG, ...(L.cfg||{})}; }
  S.mode = "local"; S.localReason = reason; renderAll();
}
async function initStore(){
  if (STANDALONE){ try { navigator.storage?.persist?.(); } catch(e){} useLocal("standalone"); return; }
  const timer = setTimeout(() => { if (S.mode === "loading") useLocal("slow"); }, 10000);
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch(e){ db = null; }
  if (!db){ clearTimeout(timer); useLocal("none"); return; }
  const fail = e => { clearTimeout(timer); S.syncError = e?.message || "Could not reach your saved jobs."; renderSync(); if (S.mode === "loading") useLocal("error"); };
  db.collection("jobs").onSnapshot(snap => {
    clearTimeout(timer);
    S.jobs = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
    S.mode = "cloud"; S.syncError = null; renderAll();
  }, fail);
  db.collection("days").onSnapshot(snap => { S.days = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); renderAll(); }, () => {});
  db.doc("config/main").onSnapshot(snap => { S.cfg = {...DEFAULT_CFG, ...(snap.exists ? snap.data() : {})}; renderAll(); }, () => {});
}
async function writeJob(job){
  S.jobs.set(job.id, job);
  if (S.mode === "cloud" && db){
    try { await db.doc("jobs/"+job.id).set(stripId(job)); }
    catch(e){ toast("Couldn't save. Check your signal and try again."); }
  } else localSave();
}
function stripId(j){ const o = {...j}; delete o.id; return o; }
async function removeJob(id){
  S.jobs.delete(id);
  if (S.mode === "cloud" && db){ try { await db.doc("jobs/"+id).delete(); } catch(e){ toast("Couldn't delete. Try again."); } }
  else localSave();
}
async function writeDay(date, patch){
  S.days[date] = {...(S.days[date]||{}), ...patch};
  if (S.mode === "cloud" && db){ try { await db.doc("days/"+date).set(S.days[date]); } catch(e){ toast("Couldn't save the day settings."); } }
  else localSave();
}
async function writeCfg(patch){
  S.cfg = {...S.cfg, ...patch};
  if (S.mode === "cloud" && db){ try { await db.doc("config/main").set(S.cfg); } catch(e){ toast("Couldn't save settings."); } }
  else localSave();
}
function setStatus(job, status, extra={}){
  const j = {...job, ...extra, status, history:[...(job.history||[]), {at:new Date().toISOString(), s:status, d:extra.date ?? job.date ?? null}].slice(-30)};
  return writeJob(j);
}

/* ---------- planning maths ---------- */
const visitMins = j => Number(j.mins) || (INSTALL_STAGE.has(j.status) ? S.cfg.installMins : S.cfg.surveyMins);
function guessDrive(a, b){
  if (!a) return S.cfg.travelMins;
  const pa = normPc(a.postcode), pb = normPc(b.postcode);
  if (pa && pa === pb) return 2;
  const sa = pa.slice(0, -2), sb = pb.slice(0, -2);
  if (sa === sb) return 5;
  if (pa.split(" ")[0] === pb.split(" ")[0]) return 10;
  return 18;
}
function dayJobs(date){
  return [...S.jobs.values()].filter(j => j.date === date && j.status !== "cancelled")
    .sort((a,b) => (a.order ?? 999) - (b.order ?? 999) || String(a.postcode).localeCompare(String(b.postcode)));
}
function schedule(date){
  const list = dayJobs(date);
  const meta = S.days[date] || {};
  const leave = toMin(meta.leave || S.cfg.leave);
  let t = leave, prev = null;
  const rows = list.map((j, i) => {
    const drive = Number.isFinite(j.drive) ? j.drive : guessDrive(prev, j);
    let arrive = t + drive;
    const ws = toMin(j.winStart), we = toMin(j.winEnd);
    let wait = 0;
    if (ws != null && arrive < ws){ wait = ws - arrive; arrive = ws; }
    const late = we != null && arrive > we;
    const end = arrive + visitMins(j);
    t = end; prev = j;
    return {j, i, drive, arrive, end, wait, late};
  });
  const back = prev ? S.cfg.travelMins : 0;
  return {rows, leave, home: t + back};
}

function fallbackParse(text){
  const pcRe = /\b([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})\b/i;
  const phRe = /(?:\+44\s?7\d{3}|07\d{3}|01\d{3}|02\d)\s?\d{3}\s?\d{3,4}/g;
  const t = s => { const m = String(s).trim().toLowerCase().match(/^(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?$/); if (!m) return null; let h = +m[1]; const mi = +(m[2]||0); if (m[3] === "pm" && h < 12) h += 12; if (m[3] === "am" && h === 12) h = 0; if (!m[3] && h < 7) h += 12; return h < 24 ? `${pad(h)}:${pad(mi)}` : null; };
  const T = "(\\d{1,2}(?:[:.]\\d{2})?\\s*(?:am|pm)?)";
  let blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  if (blocks.length === 1){ const lines = blocks[0].split("\n").filter(l => l.trim()); if (lines.filter(l => pcRe.test(l)).length > 1 && lines.every(l => pcRe.test(l) || !l.trim())) blocks = lines; }
  const out = [];
  for (const b of blocks){
    const pc = b.match(pcRe); if (!pc) continue;
    const phones = b.match(phRe) || [];
    const flat = b.replace(/\t/g, "\n");
    const lines = flat.split("\n").map(l => l.trim()).filter(Boolean);
    let addrLine = lines.find(l => /^\d+[a-z]?\s+\w/i.test(l)) || lines.find(l => pcRe.test(l)) || lines[0];
    let address = addrLine.replace(pcRe, "").replace(phRe, "").replace(/[,\s]+$/,"").trim();
    if (lines.length === 1){ address = (b.split(pcRe)[0] || "").split(/,/).slice(0,2).join(",").replace(/[,\s]+$/,"").trim() || address; }
    let window = "", winStart = null, winEnd = null, callAhead = null;
    const low = b.toLowerCase();
    let m;
    if ((m = low.match(new RegExp(T + "\\s*(?:-|–|to|until|till)\\s*" + T)))){ winStart = t(m[1]); winEnd = t(m[2]); window = m[0]; }
    else if ((m = low.match(new RegExp("after\\s*" + T)))){ winStart = t(m[1]); window = m[0]; }
    else if ((m = low.match(new RegExp("before\\s*" + T)))){ const e = toMin(t(m[1])); winEnd = e != null ? toHM(e - 15) : null; window = m[0]; }
    else if (/\b(morning|am only)\b/.test(low)){ winEnd = "12:00"; window = "Morning"; }
    else if (/\b(afternoon|pm only)\b/.test(low)){ winStart = "12:00"; window = "Afternoon"; }
    if ((m = low.match(/call\D{0,15}(\d+)\s*(h|hr|hour|min)/))) callAhead = m[2].startsWith("m") ? +m[1] : +m[1] * 60;
    else if (/call\s*(an?|one)\s*hour/.test(low)) callAhead = 60;
    if (callAhead && !window) window = `Call ${callAhead >= 60 ? callAhead/60 + " hour" : callAhead + " min"} before`;
    const rest = lines.filter(l => l !== addrLine && !pcRe.test(l)).map(l => l.replace(phRe, "").replace(/^[,\s\-:]+|[,\s\-:]+$/g, "")).filter(Boolean);
    const nameIdx = rest.findIndex(l => /^[A-Z][a-z]+(?:\s+(?:and|&)?\s*[A-Z][a-z'-]+){0,4}$/.test(l) || /^(mr|mrs|ms|miss)\b/i.test(l));
    const name = nameIdx >= 0 ? rest.splice(nameIdx, 1)[0] : "";
    const notes = rest.filter(l => !window || !l.toLowerCase().includes(window)).join(". ");
    const elderly = /\b(elderly|hard of hearing|deaf|disabled|8\d|9\d)\s*(years?|yrs?)?\b/i.test(b) && /(elderly|hearing|deaf|disabled|years|yrs|old)/i.test(b);
    out.push({ name, address, postcode: normPc(pc[1]+pc[2]), phone: phones.map(x => x.trim()).join(" / "), window, winStart, winEnd, mins: elderly ? 20 : 15, callAhead, notes, date:null });
  }
  return out;
}

function filteredJobs(section){
  const f = S.filters[section] || "all", q = S.search.trim().toLowerCase();
  return [...S.jobs.values()].filter(j => {
    if (section === "installs" ? !isInstall(j) : section === "surveys" ? isInstall(j) : false) return false;
    if (f === "togo"){ if (!TOGO.has(j.status)) return false; }
    else if (f !== "all" && j.status !== f) return false;
    if (!q) return true;
    return [j.name, j.address, j.postcode, j.phone, j.notes].some(x => String(x||"").toLowerCase().includes(q));
  }).sort((a,b) => (a.date||"9999").localeCompare(b.date||"9999") || (a.order??999)-(b.order??999) || String(a.postcode).localeCompare(String(b.postcode)));
}

/* ---------- actions ---------- */
async function moveStop(id, dir){
  const list = dayJobs(S.day), i = list.findIndex(j => j.id === id), k = i + dir;
  if (i < 0 || k < 0 || k >= list.length) return;
  [list[i], list[k]] = [list[k], list[i]];
  // reorder: times between changed neighbours fall back to postcode estimates
  const touched = new Set([i, k, i+1, k+1].filter(n => n < list.length));
  for (let n = 0; n < list.length; n++){
    const j = list[n], patch = {order:n};
    if (touched.has(n)) patch.drive = guessDrive(n === 0 ? null : list[n-1], j);
    if (j.order !== n || touched.has(n)) await writeJob({...j, ...patch});
  }
  renderAll();
}
async function planDay(){
  const date = S.day, list = dayJobs(date);
  if (!list.length) return;
  S.busy = "plan"; renderAll();
  let order = null, drive = null, leave = null, warning = "";
  const sample = await getSample();
  if (sample){
    try {
      const res = await sample.json(planPrompt(date, list), {modelTier:"default"});
      if (Array.isArray(res?.order)){
        const ids = res.order.filter(id => list.some(j => j.id === id));
        list.forEach(j => { if (!ids.includes(j.id)) ids.push(j.id); });
        order = ids; drive = Array.isArray(res.drive) ? res.drive.map(Number) : null; leave = toMin(res.leave) != null ? res.leave : null; warning = String(res.warning || "");
      }
    } catch(e){ if (e?.code === "not_granted") toast("Planning with Claude was turned off, so stops are sorted by postcode."); else toast("Couldn't plan with Claude right now, so stops are sorted by postcode."); }
  }
  if (!order){
    // no Claude: keep each postcode sector together, visit sectors by their earliest window
    const sec = j => normPc(j.postcode).slice(0,-2), groups = {};
    list.forEach(j => (groups[sec(j)] ||= []).push(j));
    const key = g => Math.min(...g.map(j => toMin(j.winEnd) ?? toMin(j.winStart) ?? 1440));
    order = Object.values(groups).sort((a,b) => key(a) - key(b) || sec(a[0]).localeCompare(sec(b[0])))
      .flatMap(g => g.sort((a,b) => (toMin(a.winStart) ?? 0) - (toMin(b.winStart) ?? 0) || String(a.address).replace(/^\S+\s/,"").localeCompare(String(b.address).replace(/^\S+\s/,"")) || String(a.address).localeCompare(String(b.address),"en",{numeric:true})))
      .map(j => j.id);
  }
  for (let n = 0; n < order.length; n++){
    const j = S.jobs.get(order[n]), prev = n ? S.jobs.get(order[n-1]) : null;
    const d = drive && Number.isFinite(drive[n]) && drive[n] >= 0 ? Math.round(drive[n]) : guessDrive(prev, j);
    await writeJob({...j, order:n, drive:d});
  }
  const stamp = new Date().toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"});
  await writeDay(date, {planned: stamp + (sample && drive ? "" : " by postcode"), warning, ...(leave ? {leave} : {})});
  S.busy = ""; renderAll();
  toast(leave ? `Planned. Suggested leaving time ${leave}.` : "Planned.");
}
async function parseList(){
  const text = $("#paste").value.trim(), date = $("#pastedate").value || null;
  if (!text){ toast("Paste a customer list first."); return; }

function saveFile(name, text, type){

function cleanPaste(t){
  return String(t)
    .replace(/[\u201C\u201D\u201E\u201F\u2033\u00AB\u00BB]/g, '"')
    .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, "'")

async function importJson(raw){
  raw = cleanPaste(raw);

  if (a0 >= 0 && a1 > a0) raw = raw.slice(a0, a1 + 1);
  let d; try { d = JSON.parse(raw); } catch(e){ toast(raw.length < 200 ? "Only part of the text was pasted. Copy the whole block and try again." : "The pasted text was changed or cut off when copying. Copy the whole block again and paste it."); return; }
  if (!d || d.app !== "wk-loft-jobs" || !Array.isArray(d.jobs)){ toast("That doesn't look like a WK jobs backup."); return; }
  let added = 0, updated = 0;
  for (const j of d.jobs){
    if (!j || !j.id) continue;
    const cur = S.jobs.get(j.id);
    const newer = !cur || String((j.history||[]).slice(-1)[0]?.at || "") >= String((cur.history||[]).slice(-1)[0]?.at || "");
    if (!cur) added++; else if (newer) updated++;
    if (newer) S.jobs.set(j.id, j);
  }
  S.days = d.plan ? {...S.days, ...(d.days||{})} : {...(d.days||{}), ...S.days};
  if (!S.jobs.size || added === d.jobs.length) S.cfg = {...DEFAULT_CFG, ...(d.cfg||{})};
  if (S.mode === "cloud" && db){ for (const j of d.jobs) if (S.jobs.get(j.id) === j) await writeJob(j); for (const k of Object.keys(d.days||{})) await writeDay(k, S.days[k]); }
  else localSave();
  if ($("#importbox")) $("#importbox").value = "";

  toast(d.plan ? `Added ${added} job${added===1?"":"s"}${updated ? `, updated ${updated}` : ""}. Route ready.` : `Imported: ${added} new, ${updated} updated.`);
  if (firstDay){ S.day = firstDay; S.autoDay = false; location.hash = "day"; } else renderAll();
}
function csv(){
  const cols = ["status","date","name","address","postcode","phone","window","notes","mins","loft_m2","depth_mm","scope"];
  const cell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const rows = [...S.jobs.values()].sort((a,b) => (a.date||"9999").localeCompare(b.date||"9999")).map(j => [ST[j.status]?.label, j.date, j.name, j.address, j.postcode, j.phone, j.window, j.notes, visitMins(j), j.survey?.area, j.survey?.depth, j.survey?.scope].map(cell).join(","));

}

/* ---------- Reasons and end of day report ---------- */
const WHY_FOR = new Set(["noanswer","rebook","cancelled"]);
const WHY_CHIPS = {
  noanswer:["Knocked, no answer","Card left","Rang, no reply","Left a voicemail","Couldn't find the address"],
  rebook:["Customer asked for another day","No answer, office to rebook","Ran out of time","No loft access today","Customer not well"],
  cancelled:["Customer cancelled","Not eligible","Already insulated","Refused the survey","Tenant, landlord said no"]};
function askWhy(id, s){
  const j = S.jobs.get(id); if (!j) return;
  $("#why")?.remove();
  const el = document.createElement("div"); el.id = "why"; el.className = "why"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Why");
  el.innerHTML = `<strong>${esc(ST[s].label)}: ${esc(j.address)}</strong><span class="muted" style="font-size:.9rem">Add a reason for the report. Tap one or type your own.</span>
    <div class="chips">${WHY_CHIPS[s].map(c => `<button type="button" data-act="why-pick">${esc(c)}</button>`).join("")}</div>
    <textarea id="why-text" style="min-height:60px" placeholder="Anything else, e.g. neighbour says they're away till Friday">${esc(j.outcome || "")}</textarea>
    <div class="row"><button class="btn primary grow" type="button" data-act="why-save" data-id="${j.id}">Save reason</button><button class="btn" type="button" data-act="why-skip">Skip</button></div>`;
  document.body.appendChild(el);
}
function reportJobs(date){
  return [...S.jobs.values()].filter(j => j.date === date || (j.history||[]).some(h => h.d === date))
    .sort((a,b) => (a.date === date ? (a.order ?? 999) : 999) - (b.date === date ? (b.order ?? 999) : 999));
}
function changedAt(j, date){
  const h = [...(j.history||[])].reverse().find(h => h.s === j.status); if (!h) return "";
  const d = new Date(h.at); return ymd(d) === date ? toHM(d.getHours()*60 + d.getMinutes()) : "";
}
function reportSubject(date){ return `End of day report, ${niceDate(date)}${S.cfg.myName ? ", " + S.cfg.myName : ""}`; }
function reportText(date){
  const list = reportJobs(date), who = j => [j.address + (j.postcode ? ", " + j.postcode : ""), j.name].filter(Boolean).join(" - ");
  const groups = [
    ["Surveyed", list.filter(j => j.status === "surveyed" || (j.status === "ready" && j.date !== date && (j.history||[]).some(h => h.s === "surveyed")))],
    ["Installed", list.filter(j => j.status === "installed")],
    ["No answer", list.filter(j => j.status === "noanswer")],
    ["To be rebooked", list.filter(j => j.status === "rebook")],
    ["Cancelled", list.filter(j => j.status === "cancelled")],
    ["Not visited", list.filter(j => ["booked","installbooked","new"].includes(j.status) && j.date === date)]];
  const used = new Set(groups.flatMap(g => g[1].map(j => j.id)));
  const other = list.filter(j => !used.has(j.id) && j.date === date);
  if (other.length) groups.push(["Other", other]);
  const lines = [`WK Loft Insulation: end of day report`, niceDate(date)];
  if (S.cfg.myName) lines.push(`Surveyor: ${S.cfg.myName}`);
  lines.push("", `${list.length} job${list.length === 1 ? "" : "s"} booked. ` + groups.filter(g => g[1].length).map(g => `${g[0]}: ${g[1].length}`).join(". ") + ".");
  groups.forEach(([title, js]) => {
    if (!js.length) return;
    lines.push("", `${title.toUpperCase()} (${js.length})`);
    js.forEach(j => {
      const t = changedAt(j, date), sv = j.survey || {}, bits = [];
      if (sv.area) bits.push(`Loft ${sv.area} m²`);
      if (sv.depth) bits.push(`existing ${sv.depth} mm`);
      if (sv.scope) bits.push(`Scope: ${sv.scope}`);
      if (j.status === "installed" && (j.install||{}).notes) bits.push(j.install.notes);
      lines.push(`- ${who(j)}${t ? " (" + t + ")" : ""}`);
      if (bits.length) lines.push(`  ${bits.join(". ")}`);
      if (j.outcome) lines.push(`  ${["noanswer","rebook","cancelled"].includes(j.status) ? "Reason" : "Note"}: ${j.outcome}`);
    });
  });
  return lines.join("\n");
}

function trafficHtml(){
  if (!STANDALONE) return `<p class="muted">Traffic alerts work in the WK app on your phone, not in this Claude version.</p>`;
  const msg = S.trafficMsg ? `<p class="muted" style="font-size:.9rem">${esc(S.trafficMsg)}</p>` : "";

  if (trafficOn()) return `<p><strong>On.</strong> Each work morning, Google's live traffic to your first stop is checked from 2½ hours before you leave. You'll get a notification saying set off earlier, leave later, or leave as planned, and again if the traffic changes a lot.</p>${msg}
    <div class="row"><button class="btn" type="button" data-act="traffic-test">Check now and send a test</button><button class="btn" type="button" data-act="traffic-off">Turn off</button></div>`;
  const iosBrowser = /iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone;
  return `<p class="muted">Get a notification each morning if traffic means you should set off earlier, or can leave later.${iosBrowser ? " On iPhone, open the app from its home screen icon first." : ""}</p>${msg}
    <button class="btn primary" type="button" data-act="traffic-on">Turn on traffic alerts</button>`;
}
function trafficDays(){
  const today = todayYmd(), out = [];
  const dates = [...new Set([...S.jobs.values()].map(j => j.date).filter(d => d && d >= today))].sort().slice(0, 14);
  for (const d of dates){
    const sch = schedule(d), first = sch.rows[0];
    if (!first || FINISHED.has(first.j.status) || !first.j.postcode) continue;
    out.push({date:d, leave:toHM(sch.leave), dest:first.j.postcode, plannedMins:first.drive});
  }
  return out;
}
async function trafficPost(path, body){
  const r = await fetch(trafficUrl() + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token:trafficToken(), ...body})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `The traffic checker said ${r.status}`);
  return d;
}
async function trafficSync(force){
  if (!STANDALONE || !trafficOn() || !trafficUrl() || S.mode === "loading") return;
  const body = {home:S.cfg.home, days:trafficDays()}, h = JSON.stringify(body);
  if (!force && h === lsGet("loftjobs-traffic-sent", "")) return;
  try { await trafficPost("/plan", body); lsSet("loftjobs-traffic-sent", h); } catch(e){ /* tries again next change */ }
}
function vapidBytes(k){ k = k.replace(/-/g, "+").replace(/_/g, "/"); while (k.length % 4) k += "="; return Uint8Array.from(atob(k), c => c.charCodeAt(0)); }
async function trafficEnable(){
  S.trafficMsg = "";
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window))
      throw new Error(/iPhone|iPad/.test(navigator.userAgent) ? "Open the WK app from its home screen icon, then try again. iPhones only allow alerts from there." : "This browser can't get alerts. Open the WK app from your home screen.");
    if (Notification.permission !== "granted" && await Notification.requestPermission() !== "granted")
      throw new Error("Notifications are blocked for the WK app. Allow them in your phone's settings, then try again.");
    const reg = await navigator.serviceWorker.ready;
    const {key} = await (await fetch(trafficUrl() + "/vapid")).json();
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options?.applicationServerKey && btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"") !== key){ await sub.unsubscribe(); sub = null; }
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:vapidBytes(key)});
    await trafficPost("/register", {sub:sub.toJSON()});
    lsSet("loftjobs-traffic", true); lsSet("loftjobs-traffic-sent", "");
    await trafficSync(true);
    S.trafficMsg = `Done. ${trafficDays().length ? "Your next working day is sent to the checker." : "Plan a day and it will be sent to the checker."}`;
    toast("Traffic alerts on.");
  } catch(e){ S.trafficMsg = e.message || "Couldn't turn traffic alerts on."; }
  renderSettings();
}
async function trafficTest(){
  S.trafficMsg = "Checking…"; renderSettings();
  try {
    await trafficSync(true);
    const d = await trafficPost("/test", {});
    S.trafficMsg = d.check ? `Live check for ${shortDate(d.next.date)}: ${d.check.title}. ${d.check.body}` : d.error ? `The traffic check failed: ${d.error}` : "Test sent. There's no planned day to check yet.";
    if (!d.push?.ok) S.trafficMsg += ` The notification didn't go through (${d.push?.why || d.push?.status || "unknown"}). Try Turn off, then Turn on again.`;
  } catch(e){ S.trafficMsg = e.message; }
  renderSettings();
}

/* ---------- Reminders ---------- */
function remindOn(){ return lsGet("loftjobs-remind", false) === true; }
function remindHtml(){
  const has = "Notification" in window, perm = has ? Notification.permission : "none", on = lsGet("loftjobs-remind", false) === true;
  if (on) return `<p><strong>Reminders are on.</strong> ${perm === "granted" ? "You'll get a phone notification and a pop-up here." : "You'll get a pop-up here while the app is open (phone notifications aren't allowed, so check the app's notification setting on your phone)."}</p>
    <div class="row"><button class="btn" type="button" data-act="remind-test">Send a test</button><button class="btn" type="button" data-act="remind-off">Turn off</button></div>`;
  return `${!has && /iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone ? `<p class="muted">On iPhone, notifications only work once the app is on your home screen. Open it from there and turn reminders on.</p>` : ""}
    <button class="btn primary" type="button" data-act="remind-on">Turn on reminders</button>`;
}
async function remindEnable(){
  lsSet("loftjobs-remind", true);
  if ("Notification" in window && Notification.permission === "default"){ try { await Notification.requestPermission(); } catch(e){} }
  renderAll();
  toast("Notification" in window && Notification.permission === "granted" ? "Reminders on." : "Reminders on inside the app.");
  remindTick();
}
function dayReminders(date){
  const sch = schedule(date), meta = S.days[date] || {}, out = [];
  const open = sch.rows.filter(x => !FINISHED.has(x.j.status));
  if (!open.length) return out;
  const who = j => j.name || j.address;
  if (!sch.rows.some(x => FINISHED.has(x.j.status))){
    const f = sch.rows[0].j, maps = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(S.cfg.home + ", UK")}&destination=${q(f)}&travelmode=driving`;
    out.push({key:`${date}-traffic`, at: sch.leave - 60, title:"Check the traffic", body:`Look at Google Maps for the drive to ${f.address}, ${f.postcode}. The plan allows ${Number.isFinite(f.drive) ? f.drive : S.cfg.travelMins} minutes. If Maps says longer, set off that much earlier.`, tel:"", url:maps});
  }
  if (!sch.rows.some(x => FINISHED.has(x.j.status)))
    out.push({key:`${date}-leave`, at: sch.leave - 10, title:`Leave at ${toHM(sch.leave)}`, body:`${sch.rows.length} visits today. First stop ${sch.rows[0].j.address} about ${toHM(sch.rows[0].arrive)}.`, tel:""});
  open.forEach(x => {
    const j = x.j;
    if (j.callAhead) out.push({key:`${date}-call-${j.id}`, at: x.arrive - j.callAhead, title:`Ring ${who(j)} now`, body:`${j.address}. You're due about ${toHM(x.arrive)}. ${j.phone ? "Phone " + j.phone + "." : ""}`, tel:j.phone});
    const we = toMin(j.winEnd);
    if (we != null) out.push({key:`${date}-win-${j.id}`, at: we - 30, title:`${who(j)}: window closes soon`, body:`${j.address} needs you by ${toHM(we)}${j.window ? " (" + j.window + ")" : ""}. Planned for about ${toHM(x.arrive)}.`, tel:j.phone});
  });
  return out.sort((a,b) => a.at - b.at);
}
async function fireReminder(r){
  const fired = lsGet("loftjobs-fired", {});
  fired[r.key] = Date.now(); lsSet("loftjobs-fired", fired);
  if ("Notification" in window && Notification.permission === "granted"){
    const opt = {body:r.body, tag:r.key, renotify:true, requireInteraction:true, icon:"icons/icon-192.png", badge:"icons/icon-192.png", data:{url:location.href.split("#")[0] + "#day"}};
    try { const reg = await navigator.serviceWorker?.getRegistration?.(); if (reg) await reg.showNotification(r.title, opt); else new Notification(r.title, opt); } catch(e){}
  }
  try { navigator.vibrate?.([300,150,300]); } catch(e){}
  $("#remind")?.remove();
  const el = document.createElement("div"); el.id = "remind"; el.className = "remind"; el.setAttribute("role","alert");
  const tel = (r.tel || "").split("/")[0].replace(/[^\d+]/g, "");
  el.innerHTML = `<strong>${esc(r.title)}</strong><span>${esc(r.body)}</span><div class="row">${tel ? `<a class="btn primary" href="tel:${tel}">Ring now</a>` : ""}${r.url ? `<a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener">Open Google Maps</a>` : ""}<button class="btn" type="button" data-act="remind-x">OK</button></div>`;
  document.body.appendChild(el);
}
function remindTick(){
  if (lsGet("loftjobs-remind", false) !== true || S.mode === "loading") return;
  const now = new Date(), date = ymd(now), mins = now.getHours()*60 + now.getMinutes();
  const fired = lsGet("loftjobs-fired", {});
  for (const k of Object.keys(fired)) if (Date.now() - fired[k] > 3*864e5) delete fired[k];
  lsSet("loftjobs-fired", fired);
  const due = dayReminders(date).filter(r => !fired[r.key] && r.at <= mins && mins - r.at <= 20);
  if (!due.length) return;
  due.slice(0,-1).forEach(r => { fired[r.key] = Date.now(); });
  lsSet("loftjobs-fired", fired);
  fireReminder(due[due.length-1]);
}
setInterval(remindTick, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) remindTick(); });
function icsText(date){
  const pad = n => String(n).padStart(2,"0"), d = date.replace(/-/g,"");
  const t = m => `${d}T${pad(Math.floor(m/60))}${pad(m%60)}00`;
  const e = s => String(s).replace(/\\/g,"\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g,"\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const ev = dayReminders(date).map(r => ["BEGIN:VEVENT", `UID:${r.key}@wk-loft-jobs`, `DTSTAMP:${stamp}`, `DTSTART:${t(r.at)}`, `DTEND:${t(r.at + 5)}`, `SUMMARY:${e(r.title)}`, `DESCRIPTION:${e(r.body + (r.url ? "\n" + r.url : ""))}`, ...(r.url ? [`URL:${r.url}`] : []), "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${e(r.title)}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].join("\r\n"));
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//WK Loft Insulation//WK Loft Jobs//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH", ...ev, "END:VCALENDAR"].join("\r\n") + "\r\n";
}
async function saveIcs(date){
  const list = dayReminders(date);
  if (!list.length){ toast("No reminders left for this day."); return; }
  const name = `wk-reminders-${date}.ics`, txt = icsText(date);
  if (STANDALONE){
    const url = URL.createObjectURL(new Blob([txt], {type:"text/calendar"}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast("Open the file and choose Add to calendar."); return;
  }
  try { if (downloads === null) downloads = window.claude?.use ? await window.claude.use("downloads") : null; } catch(err){ downloads = null; }
  if (!downloads){ toast("Downloads aren't available here."); return; }
  try { await downloads.save({filename:name, data:txt}); toast("Saved. Open it to add the reminders to your calendar."); }
  catch(err){ if (err?.code !== "declined") toast("Couldn't save the file."); }
}

setView(location.hash.slice(1) || "day");
initStore();
</script>
